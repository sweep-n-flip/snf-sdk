# SnF Partner SDK CI.
#
# `unit`: lint + typecheck + test + build + size-limit + grep-gate on every push/PR.
# `fork`: 4-chain anvil fork matrix skeleton (Base/Arbitrum/Robinhood/Arc) — body
# filled in later. Deliberately a SEPARATE job that `unit` does not depend on
# (the fork-lane matrix is a separate, opt-in workflow job that unit CI does not
# depend on).
#
# This workflow references no repository secret anywhere: fork lanes default to
# public RPCs so this new repo's CI never depends on a workspace Alchemy key.
# OPTIONAL future opt-in: ALCHEMY_KEY as
# a repo secret, once the founder decides to share it with this repo specifically.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}
  schedule:
    # Weekly, keyless, read-only re-verification against live mainnet — see
    # the `backstop` job below for why it cannot actually run from this repo alone.
    - cron: '0 6 * * 1'

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Bundle size gate (60 kB gzip ceiling)
        run: pnpm size

      - name: Grep gate (no SnF endpoints/keys/process.env/private-client import)
        run: pnpm grep:gate

      - name: Release gate (stubs, ABI inventory, secrets, bundle, version)
        run: pnpm release:gate

  fork:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        chain: [base, arbitrum, robinhood, arc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build (fork lanes exercise the real published-shaped package)
        run: pnpm -r build

      # Each matrix leg's port is FIXED per chain in test/fork/chains.fork.json
      # (base=8545, arbitrum=8546, robinhood=8547, arc=8548) — the isolation test
      # (test/fork/isolation.fork.test.ts) already asserts these four are pairwise
      # distinct. ANVIL_PORT below is a small case mapping over the SAME four ports,
      # set here purely so CI's own environment is an explicit, auditable witness
      # that it agrees with the JSON config — the real uniqueness guarantee is the
      # fixed per-lane port in chains.fork.json, not this env var (the fork-lane
      # isolation edge, enforced twice: once in the isolation test, once here).
      - name: Resolve this matrix leg's anvil port
        id: port
        run: |
          case "${{ matrix.chain }}" in
            base) echo "port=8545" >> "$GITHUB_OUTPUT" ;;
            arbitrum) echo "port=8546" >> "$GITHUB_OUTPUT" ;;
            robinhood) echo "port=8547" >> "$GITHUB_OUTPUT" ;;
            arc) echo "port=8548" >> "$GITHUB_OUTPUT" ;;
          esac

      # Each matrix leg runs ONLY its own chain's lane (test:fork:${chain}), never
      # the shared test:fork (all four) — a single leg failing never blocks the
      # other three from reporting (fail-fast: false above), and each `it` title
      # names its chain (base.fork.test.ts's own header note), so a CI failure
      # identifies the chain from the job name alone.
      - name: Run fork tests for ${{ matrix.chain }}
        run: pnpm --filter @sweepnflip/sdk test:fork:${{ matrix.chain }}
        env:
          ANVIL_PORT: ${{ steps.port.outputs.port }}
          # OPTIONAL: ALCHEMY_KEY — not wired here on purpose (see file header
          # comment). Public RPCs are the default until the founder opts this repo in.

      # Diagnosability without re-running: anvil's own log + the fork config it ran
      # against, uploaded ONLY on failure (nothing to upload on a green run).
      - name: Upload fork lane diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fork-lane-${{ matrix.chain }}-diagnostics
          path: |
            packages/sdk/test/fork/chains.fork.json
          retention-days: 7

  # The keyless, read-only live backstop — lives in a SEPARATE, private
  # exploration repo, not this one. This job is
  # documentation of intent for when both repos are checked out together in one CI
  # environment (e.g. a workspace-level pipeline, or a future consolidation) — it is
  # NOT runnable as-is from an snf-sdk-only checkout, since that other repo is not a
  # submodule of this repo.
  backstop:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Not runnable from this repo alone
        run: |
          echo "The backstop script lives in a separate, private exploration repo."
          echo "This job is intent-documentation only until both repos are checked out together"
          echo "(e.g. a workspace-level CI pipeline)."
          exit 0
